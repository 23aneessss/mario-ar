name: mario-ar
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mario}
      POSTGRES_DB: ${POSTGRES_DB:-mario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  storage:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run npm run setup:env first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run npm run setup:env first}
      S3_BUCKET: ${S3_BUCKET:-mario-photos}
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["storage_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mario}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mario}
      S3_ENDPOINT: http://storage:8333
    ports: ["${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"]
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
  cleanup:
    image: node:22-alpine
    restart: unless-stopped
    environment:
      CLEANUP_SECRET: ${CLEANUP_SECRET}
    volumes: ["./scripts/cleanup-worker.mjs:/worker.mjs:ro"]
    command: ["node", "/worker.mjs"]
    depends_on:
      app: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "9264:9264"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: {condition: service_healthy}
volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
